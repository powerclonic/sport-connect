<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Privacy &amp; Security Settings</title>
<!-- Google Fonts: Lexend & Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Lexend:wght@600;700;900&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error-container": "#93000a",
                    "on-tertiary-fixed-variant": "#38485d",
                    "on-primary-fixed-variant": "#7a3000",
                    "on-secondary": "#ffffff",
                    "outline": "#8e7164",
                    "inverse-primary": "#ffb693",
                    "primary-fixed": "#ffdbcc",
                    "on-surface-variant": "#5a4136",
                    "on-surface": "#191c1e",
                    "tertiary": "#505f76",
                    "tertiary-container": "#8a9ab2",
                    "on-background": "#191c1e",
                    "surface-tint": "#a04100",
                    "primary-container": "#ff6b00",
                    "surface-bright": "#f7f9fb",
                    "surface-container-high": "#e6e8ea",
                    "on-tertiary-container": "#223246",
                    "secondary-container": "#dae2fd",
                    "on-primary-fixed": "#351000",
                    "on-secondary-fixed-variant": "#3f465c",
                    "primary-fixed-dim": "#ffb693",
                    "inverse-surface": "#2d3133",
                    "background": "#f7f9fb",
                    "on-primary-container": "#572000",
                    "inverse-on-surface": "#eff1f3",
                    "surface": "#f7f9fb",
                    "secondary-fixed-dim": "#bec6e0",
                    "on-tertiary-fixed": "#0b1c30",
                    "secondary": "#565e74",
                    "on-tertiary": "#ffffff",
                    "surface-container-highest": "#e0e3e5",
                    "error-container": "#ffdad6",
                    "tertiary-fixed-dim": "#b7c8e1",
                    "surface-container": "#eceef0",
                    "secondary-fixed": "#dae2fd",
                    "surface-variant": "#e0e3e5",
                    "outline-variant": "#e2bfb0",
                    "surface-dim": "#d8dadc",
                    "on-secondary-container": "#5c647a",
                    "primary": "#a04100",
                    "on-error": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-low": "#f2f4f6",
                    "on-primary": "#ffffff",
                    "tertiary-fixed": "#d3e4fe",
                    "error": "#ba1a1a",
                    "on-secondary-fixed": "#131b2e"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-padding": "24px",
                    "stack-md": "16px",
                    "unit": "8px",
                    "gutter": "16px",
                    "stack-sm": "8px",
                    "stack-lg": "32px"
            },
            "fontFamily": {
                    "rating-num": ["Lexend"],
                    "h3": ["Lexend"],
                    "h2": ["Lexend"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-md": ["Inter"],
                    "h1": ["Lexend"]
            },
            "fontSize": {
                    "rating-num": ["20px", { "lineHeight": "1", "fontWeight": "700" }],
                    "h3": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                    "h2": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                    "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                    "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                    "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                    "h1": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }]

          }
        }
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen pb-stack-lg">
<!-- TopAppBar: Adapted for Sub-page context -->
<header class="sticky top-0 w-full z-50 flex justify-between items-center px-6 py-4 bg-surface-container-lowest shadow-[0_2px_10px_rgba(0,0,0,0.02)]">
<button aria-label="Go back" class="text-on-surface hover:opacity-80 active:scale-95 transition-all duration-200 flex items-center justify-center p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 400;">arrow_back</span>
</button>
<h1 class="font-h3 text-h3 text-on-surface tracking-tight">Privacidade e Segurança</h1>
<!-- Invisible spacer to perfectly center the title against the back button -->
<div class="w-10"></div>
</header>
<!-- Main Content Canvas -->
<main class="max-w-2xl mx-auto px-container-padding mt-stack-lg space-y-stack-lg">
<!-- Privacy Section -->
<section>
<h2 class="font-label-md text-label-md text-primary uppercase mb-stack-sm ml-unit">Privacidade</h2>
<div class="bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgba(0,0,0,0.04)] overflow-hidden">
<!-- Option: Perfil Público/Privado -->
<button class="w-full flex items-center justify-between p-4 bg-surface-container-lowest hover:bg-surface-bright active:bg-surface-container transition-colors border-b border-surface-container group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">public</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface text-left">Perfil Público/Privado</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- Option: Mostrar Localização Aproximada -->
<button class="w-full flex items-center justify-between p-4 bg-surface-container-lowest hover:bg-surface-bright active:bg-surface-container transition-colors border-b border-surface-container group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface text-left">Mostrar Localização Aproximada</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- Option: Quem pode me convidar -->
<button class="w-full flex items-center justify-between p-4 bg-surface-container-lowest hover:bg-surface-bright active:bg-surface-container transition-colors group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group_add</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface text-left">Quem pode me convidar</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">chevron_right</span>
</button>
</div>
</section>
<!-- Security Section -->
<section>
<h2 class="font-label-md text-label-md text-primary uppercase mb-stack-sm ml-unit">Segurança</h2>
<div class="bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgba(0,0,0,0.04)] overflow-hidden">
<!-- Option: Autenticação em duas etapas -->
<button class="w-full flex items-center justify-between p-4 bg-surface-container-lowest hover:bg-surface-bright active:bg-surface-container transition-colors border-b border-surface-container group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface text-left">Autenticação em duas etapas</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- Option: Sessões Ativas -->
<button class="w-full flex items-center justify-between p-4 bg-surface-container-lowest hover:bg-surface-bright active:bg-surface-container transition-colors border-b border-surface-container group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">devices</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface text-left">Sessões Ativas</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- Option: Alterar Senha -->
<button class="w-full flex items-center justify-between p-4 bg-surface-container-lowest hover:bg-surface-bright active:bg-surface-container transition-colors group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">password</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface text-left">Alterar Senha</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">chevron_right</span>
</button>
</div>
</section>
</main>
</body></html>
