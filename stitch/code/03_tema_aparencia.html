<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Configurações de Tema - SportConnect</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Lexend:wght@600;700;900&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
<!-- Tailwind CSS & Config -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#38485d",
                        "on-primary-fixed-variant": "#7a3000",
                        "on-secondary": "#ffffff",
                        "outline": "#8e7164",
                        "inverse-primary": "#ffb693",
                        "primary-fixed": "#ffdbcc",
                        "on-surface-variant": "#5a4136",
                        "on-surface": "#191c1e",
                        "tertiary": "#505f76",
                        "tertiary-container": "#8a9ab2",
                        "on-background": "#191c1e",
                        "surface-tint": "#a04100",
                        "primary-container": "#ff6b00",
                        "surface-bright": "#f7f9fb",
                        "surface-container-high": "#e6e8ea",
                        "on-tertiary-container": "#223246",
                        "secondary-container": "#dae2fd",
                        "on-primary-fixed": "#351000",
                        "on-secondary-fixed-variant": "#3f465c",
                        "primary-fixed-dim": "#ffb693",
                        "inverse-surface": "#2d3133",
                        "background": "#f7f9fb",
                        "on-primary-container": "#572000",
                        "inverse-on-surface": "#eff1f3",
                        "surface": "#f7f9fb",
                        "secondary-fixed-dim": "#bec6e0",
                        "on-tertiary-fixed": "#0b1c30",
                        "secondary": "#565e74",
                        "on-tertiary": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "surface-container": "#eceef0",
                        "secondary-fixed": "#dae2fd",
                        "surface-variant": "#e0e3e5",
                        "outline-variant": "#e2bfb0",
                        "surface-dim": "#d8dadc",
                        "on-secondary-container": "#5c647a",
                        "primary": "#a04100",
                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f2f4f6",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#d3e4fe",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#131b2e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "24px",
                        "stack-md": "16px",
                        "unit": "8px",
                        "gutter": "16px",
                        "stack-sm": "8px",
                        "stack-lg": "32px"
                    },
                    "fontFamily": {
                        "rating-num": ["Lexend"],
                        "h3": ["Lexend"],
                        "h2": ["Lexend"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "h1": ["Lexend"]
                    },
                    "fontSize": {
                        "rating-num": ["20px", { "lineHeight": "1", "fontWeight": "700" }],
                        "h3": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "h2": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "h1": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen antialiased selection:bg-primary-container selection:text-on-primary-container flex flex-col">
<!-- TopAppBar (Mapped from JSON with Contextual Back Button) -->
<header class="sticky top-0 w-full z-50 border-b border-slate-100 dark:border-slate-900 shadow-sm dark:shadow-none bg-white dark:bg-slate-950 flex justify-between items-center px-6 py-4 w-full">
<button aria-label="Voltar" class="text-slate-400 dark:text-slate-600 hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200 flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-surface-container" type="button">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-lexend text-lg font-bold tracking-tight text-on-surface flex-1 text-center pr-8">Tema</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-container-padding py-stack-lg max-w-3xl mx-auto w-full flex flex-col gap-stack-lg">
<section class="flex flex-col gap-stack-sm">
<h2 class="font-h2 text-h2 text-on-surface">Aparência</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Escolha como o SportConnect aparece para você. Personalize a interface para maior conforto visual.</p>
</section>
<!-- Visual Previews Grid -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Claro (Light Mode) - Active Selection -->
<button class="flex flex-col text-left group bg-surface-container-lowest rounded-xl p-stack-md shadow-[0_8px_30px_rgba(0,0,0,0.04)] border-2 border-primary-container relative active:scale-[0.98] transition-transform w-full">
<!-- Active Indicator -->
<div class="absolute top-4 right-4 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center w-6 h-6 shadow-sm">
<span class="material-symbols-outlined text-[16px]" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<!-- Wireframe Preview (Light) -->
<div aria-hidden="true" class="w-full h-32 bg-surface rounded-lg border border-surface-variant mb-stack-md p-3 flex flex-col gap-2 overflow-hidden">
<div class="w-full h-6 flex justify-between items-center border-b border-surface-variant pb-2">
<div class="w-16 h-2 bg-surface-dim rounded-full"></div>
<div class="w-4 h-4 rounded-full bg-surface-dim"></div>
</div>
<div class="flex gap-2">
<div class="w-10 h-10 rounded-full bg-primary-container/20"></div>
<div class="flex flex-col gap-1 flex-1 py-1">
<div class="w-3/4 h-2 bg-surface-dim rounded-full"></div>
<div class="w-1/2 h-2 bg-surface-dim rounded-full"></div>
</div>
</div>
<div class="w-full flex-1 bg-surface-container-low rounded-md mt-1"></div>
</div>
<h3 class="font-h3 text-h3 text-on-surface mb-1">Claro</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Interface clara, ideal para ambientes iluminados.</p>
</button>
<!-- Escuro (Dark Mode) -->
<button class="flex flex-col text-left group bg-surface-container-lowest rounded-xl p-stack-md shadow-[0_8px_30px_rgba(0,0,0,0.04)] border-2 border-transparent hover:border-surface-variant relative active:scale-[0.98] transition-all w-full">
<!-- Inactive Indicator (Empty Circle) -->
<div class="absolute top-4 right-4 text-surface-variant rounded-full flex items-center justify-center w-6 h-6">
<span class="material-symbols-outlined text-[24px]" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</div>
<!-- Wireframe Preview (Dark) -->
<div aria-hidden="true" class="w-full h-32 bg-[#1A1C1E] rounded-lg border border-[#2D3133] mb-stack-md p-3 flex flex-col gap-2 overflow-hidden">
<div class="w-full h-6 flex justify-between items-center border-b border-[#2D3133] pb-2">
<div class="w-16 h-2 bg-[#42474E] rounded-full"></div>
<div class="w-4 h-4 rounded-full bg-[#42474E]"></div>
</div>
<div class="flex gap-2">
<div class="w-10 h-10 rounded-full bg-primary/30"></div>
<div class="flex flex-col gap-1 flex-1 py-1">
<div class="w-3/4 h-2 bg-[#42474E] rounded-full"></div>
<div class="w-1/2 h-2 bg-[#42474E] rounded-full"></div>
</div>
</div>
<div class="w-full flex-1 bg-[#222527] rounded-md mt-1"></div>
</div>
<h3 class="font-h3 text-h3 text-on-surface mb-1">Escuro</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Reduz o cansaço visual em ambientes escuros.</p>
</button>
</section>
<!-- System Default Option -->
<section>
<button class="w-full flex items-center justify-between p-stack-md bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.02)] border border-transparent hover:border-surface-variant transition-colors active:scale-[0.99]">
<div class="flex items-center gap-4 text-left">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="settings_brightness">settings_brightness</span>
</div>
<div class="flex flex-col">
<span class="font-h3 text-h3 text-on-surface text-[18px]">Seguir Sistema</span>
<span class="font-body-md text-body-md text-on-surface-variant text-sm">Ajusta automaticamente com seu dispositivo</span>
</div>
</div>
<div class="text-surface-variant">
<span class="material-symbols-outlined text-[24px]" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</div>
</button>
</section>
</main>
</body></html>
