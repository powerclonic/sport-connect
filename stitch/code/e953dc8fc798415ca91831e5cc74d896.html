<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-bright": "#f7f9fb",

                    "surface-container-high": "#e6e8ea",
                    "on-primary-fixed": "#351000",
                    "on-surface-variant": "#5a4136",

                    "error-container": "#ffdad6",
                    "surface-tint": "#a04100",
                    "primary": "#a04100",
                    "outline-variant": "#e2bfb0",
                    "primary-fixed-dim": "#ffb693",
                    "error": "#ba1a1a",
                    "tertiary": "#505f76",
                    "tertiary-container": "#8a9ab2",
                    "inverse-surface": "#2d3133",
                    "inverse-primary": "#ffb693",
                    "surface-variant": "#e0e3e5",
                    "surface-dim": "#d8dadc",
                    "surface-container": "#eceef0",
                    "background": "#f7f9fb",
                    "on-tertiary-fixed-variant": "#38485d",
                    "on-tertiary-container": "#223246",
                    "on-primary-container": "#572000",
                    "surface-container-lowest": "#ffffff",
                    "on-error": "#ffffff",
                    "inverse-on-surface": "#eff1f3",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed": "#0b1c30",
                    "tertiary-fixed-dim": "#b7c8e1",
                    "primary-fixed": "#ffdbcc",
                    "on-error-container": "#93000a",
                    "secondary-container": "#dae2fd",
                    "on-secondary-container": "#5c647a",
                    "on-secondary-fixed-variant": "#3f465c",
                    "on-secondary": "#ffffff",
                    "secondary-fixed": "#dae2fd",
                    "surface-container-highest": "#e0e3e5",
                    "on-primary-fixed-variant": "#7a3000",
                    "tertiary-fixed": "#d3e4fe",
                    "on-background": "#191c1e",
                    "outline": "#8e7164",
                    "on-secondary-fixed": "#131b2e",
                    "surface": "#f7f9fb",
                    "secondary-fixed-dim": "#bec6e0",
                    "secondary": "#565e74",
                    "on-primary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "16px",
                    "stack-sm": "8px",
                    "stack-lg": "32px",
                    "container-padding": "24px",
                    "unit": "8px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "h3": ["Lexend"],
                    "h2": ["Lexend"],
                    "rating-num": ["Lexend"],
                    "label-md": ["Inter"],
                    "h1": ["Lexend"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "h3": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "h2": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "rating-num": ["20px", {"lineHeight": "1", "fontWeight": "700"}],
                    "label-md": ["14px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "h1": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="font-body-md text-on-surface relative min-h-screen">
<!-- Background Image with Overlay -->
<div class="fixed inset-0 z-[-1] overflow-hidden">
<img alt="Blurred sports background" class="w-full h-full object-cover blur-sm scale-110" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDXUD-NkKKuCENjFJGUIXpGYSFj1JrSHNZuMU38ks5_I4hDdP4qHCsSrLrPEBQzmcsf9BqWgqHWSPgFilT9EjykJTtZeKgrUA-ODyvM8pFQPNO7CxGq9qI0Q72puWazMYg7sb5fzQl7GKWFjmxyKZsCxFcPBOFm1NmWNN6ucHj7qRWJ_i2JJrjQvqJk3LrQBz5YGP5-u_fSENVuklcTLPy8y2r1UBkI7cLCAbgUMEVnX68bc-5HDTFNG6aTg7w3a66F5zCtei2NOfZO"/>
<div class="absolute inset-0 bg-black/60"></div>
</div>
<main class="min-h-screen flex flex-col items-center justify-center px-container-padding py-stack-lg relative z-10">
<!-- Logo Section -->
<div class="mb-stack-lg text-center mt-8">
<h1 class="font-h1 text-h1 text-[#FF6B00] uppercase tracking-tighter font-black">SportConnect</h1>
<p class="font-body-md text-white/90 mt-2 max-w-xs mx-auto">Connect with athletes and organize your next game instantly.</p>
</div>
<!-- Login Card -->
<div class="w-full max-w-md bg-white rounded-[32px] p-stack-lg shadow-2xl">
<h2 class="font-h2 text-h2 mb-stack-md text-on-surface">Welcome back</h2>
<form class="space-y-stack-md">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="email">Email Address</label>
<div class="relative">
<input class="w-full h-14 px-4 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-[#FF6B00] focus:bg-white transition-all font-body-md text-on-surface" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="password">Password</label>
<a class="font-label-md text-label-md text-[#FF6B00] hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full h-14 px-4 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-[#FF6B00] focus:bg-white transition-all font-body-md text-on-surface" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-14 bg-[#FF6B00] text-white font-h3 text-body-lg rounded-full shadow-lg shadow-orange-200 active:scale-95 transition-all flex items-center justify-center gap-2 mt-stack-md" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="relative my-stack-lg flex items-center">
<div class="flex-grow border-t border-surface-container-high"></div>
<span class="px-4 font-label-md text-label-md text-on-surface-variant bg-white">OR CONTINUE WITH</span>
<div class="flex-grow border-t border-surface-container-high"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-gutter">
<button class="flex items-center justify-center gap-2 h-14 border border-surface-container-high rounded-full hover:bg-surface-container-low transition-colors font-label-md text-on-surface">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCBP5Zx8nLQosS9P-RNuNHIZOeESyaKA18irM-aelYaT8W-q8wb5-lNwhHZa2BV5sjWlyYXpzE0A16jtqkpgY9-ehfxLx4w96fZ53CK82qyClrfUyZD1_WHpttvt45UHleNyckULT-Vuia0P5myMPSSrQnhVPlSuY6M8cN3OQFehvM0rPWtizoB4fwdA4CMRR9rMBOneeYDYNnZDSKOFJfMlEOtsuRRDOSrXLm2NbUNrTJEw2y7K6_MZTRbFqA2PchAeXuw8lJr5XBF"/>
                    Google
                </button>
<button class="flex items-center justify-center gap-2 h-14 border border-surface-container-high rounded-full hover:bg-surface-container-low transition-colors font-label-md text-on-surface">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">ios</span>
                    Apple
                </button>
</div>
</div>
<!-- Footer Link -->
<p class="mt-stack-lg font-body-md text-white/90 text-center">
            Don't have an account? 
            <a class="text-[#FF6B00] font-bold hover:underline" href="#">Join the community</a>
</p>
</main>
</body></html>
